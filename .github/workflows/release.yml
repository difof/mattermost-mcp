name: Release

on:
  push:
    branches: [master]

# Serialize releases so two pushes can't open competing Version PRs.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # create the version commit, tag, and GitHub Release
  pull-requests: write # open/update the "Version Packages" PR
  id-token: write # OIDC trusted publishing + automatic provenance attestation

jobs:
  release:
    # This fork builds from source; the inherited npm package belongs to upstream.
    if: github.repository == 'BryanBerger98/mattermost-mcp'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24 # current LTS; also satisfies OIDC trusted publishing (Node >= 22.14)
          cache: npm
          registry-url: https://registry.npmjs.org

      # Trusted publishing (OIDC) needs npm >= 11.5.1; runners ship npm 10.
      - run: npm install -g npm@latest

      - run: npm ci

      # Gate the release on a green build before anything is published.
      - run: npm run lint
      - run: npm test

      # Opens/updates the "Version Packages" PR when changesets exist;
      # when that PR is merged, runs `publish` to build + push to npm.
      - name: Create Release PR or publish to npm
        uses: changesets/action@v1
        with:
          version: npm run version
          publish: npm run release
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          # No NPM_TOKEN on purpose: with id-token:write + npm >= 11.5.1, the action
          # publishes via npm OIDC trusted publishing (configured on npmjs.com for
          # this repo + release.yml). Provenance is attached automatically.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
