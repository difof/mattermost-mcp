name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: node scripts/check-portability.mjs

      - run: npm ci

      - run: npm run lint

      - run: npm test

      - name: Check generated inventory and catalog against pinned upstream source
        run: |
          node scripts/audit-api-coverage.mjs --download --cache "$RUNNER_TEMP/mm-api-source" --check
          node scripts/generate-api-catalog.mjs --download --cache "$RUNNER_TEMP/mm-api-source" --check

      - run: npm run build
